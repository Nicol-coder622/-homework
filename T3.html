<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let size =8;
        let board = "";
        for (let row =0;row < size;row++){
            for (let col = 0;col<size;col++){
                if((row+col)%2===0){
                    board +=" ";
                }else{
                    board+="#";
                }
            }
            board +="\n";
        }
        console.log(board);
    </script>
</body>
</html>
